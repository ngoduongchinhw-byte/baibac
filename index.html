<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7f5" />
  <title>Tính tiền</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6b4a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #17211c;
      --muted: #6d7872;
      --line: #e5eeea;
      --bg: #f3f6f4;
      --card: #ffffff;
      --green: #0e7a48;
      --green-soft: #e8f6ee;
      --red: #c2412d;
      --red-soft: #fdeceb;
      --shadow: 0 10px 30px rgba(23, 33, 28, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    [hidden] { display: none !important; }
    body {
      min-height: 100dvh;
      font-family: "Be Vietnam Pro", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 280px at 50% -80px, #dff3e7, transparent 70%),
        var(--bg);
      font-size: 16px;
      line-height: 1.4;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .wrap {
      width: min(480px, 100%);
      margin: 0 auto;
      padding: 22px 16px calc(112px + env(safe-area-inset-bottom));
    }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    header h1 { margin: 0; font-size: 28px; letter-spacing: -0.045em; line-height: 1; }
    .lede { margin: 0; color: var(--muted); font-size: 14px; text-align: right; }
    h2 { margin: 26px 0 8px; font-size: 15px; font-weight: 650; color: var(--muted); }
    .sheet {
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .row { padding: 14px 14px 12px; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row.win { background: linear-gradient(90deg, var(--green-soft), #fff 42%); }
    .row.lose { background: linear-gradient(90deg, var(--red-soft), #fff 42%); }
    .row-top, .row-entry { display: flex; align-items: center; gap: 10px; }
    .row-entry { margin-top: 10px; }
    .seat {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      flex: none;
    }
    .name {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      padding: 0;
      font-weight: 650;
      font-size: 17px;
    }
    .name:focus { outline: none; }
    .bal { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .zero { color: #9aa39e; }
    .money {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      background: #f4f7f5;
      border-radius: 14px;
      padding: 0 12px;
    }
    .row.win .money { background: #fff; }
    .row.lose .money { background: #fff; }
    .money input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-height: 46px;
      width: 100%;
    }
    .money input:focus { outline: none; }
    .money span { color: var(--muted); font-size: 14px; }
    .row.win .money input { color: var(--green); }
    .row.lose .money input { color: var(--red); }
    .signs {
      display: flex;
      flex: none;
      padding: 3px;
      background: #eef2f0;
      border-radius: 999px;
    }
    .sign {
      min-height: 40px;
      min-width: 64px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-weight: 650;
      font-size: 14px;
    }
    .sign[data-sign="win"][aria-pressed="true"] { background: var(--green); color: #fff; }
    .sign[data-sign="lose"][aria-pressed="true"] { background: var(--red); color: #fff; }
    .preview { margin: 10px 4px 0; color: var(--muted); font-size: 14px; min-height: 1.4em; }
    .empty { margin: 0; padding: 14px; color: var(--muted); }
    .round { padding: 14px; border-top: 1px solid var(--line); }
    .round:first-child { border-top: 0; }
    .round-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .round p { margin: 4px 0 8px; color: var(--muted); font-size: 14px; }
    .when { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .chip, .ghost, .danger {
      border: 0;
      border-radius: 999px;
      min-height: 36px;
      padding: 0 12px;
      background: #eef2f0;
      color: var(--ink);
      scroll-margin-bottom: 110px;
    }
    .sum-line, .transfer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }
    .sum-line:first-child, .transfer:first-child { border-top: 0; }
    .transfer { color: var(--ink); background: #f7fbf8; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button { flex: 1; min-height: 46px; border-radius: 14px; }
    .ghost { background: #fff; box-shadow: var(--shadow); }
    .danger { background: #fff; color: var(--red); box-shadow: var(--shadow); }
    .dock {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: rgba(243, 246, 244, 0.92);
      backdrop-filter: blur(12px);
    }
    .dock button, .dialog-actions button {
      width: min(480px, 100%);
      margin: 0 auto;
      display: block;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: var(--green);
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      box-shadow: 0 8px 18px rgba(14, 122, 72, 0.22);
    }
    .dock button:disabled { background: #d7e0db; color: #6d7872; box-shadow: none; }
    .dialog-actions .ghost { background: #eef2f0; color: var(--ink); box-shadow: none; }
    dialog {
      border: 0;
      border-radius: 18px;
      padding: 18px;
      width: min(420px, calc(100% - 32px));
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(28, 25, 23, 0.35); }
    dialog h2 { margin: 0 0 8px; }
    dialog p { margin: 0; color: var(--muted); }
    .dialog-actions { display: flex; gap: 8px; margin-top: 16px; }
    .dialog-actions button { width: auto; flex: 1; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(84px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: #1c1917;
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      max-width: calc(100% - 32px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tính tiền</h1>
      <p class="lede">4 người</p>
    </header>
    <section class="sheet" id="board"></section>
    <p class="preview" id="preview"></p>

    <h2>Các ván</h2>
    <section class="sheet" id="rounds"></section>

    <h2>Tổng kết</h2>
    <section class="sheet" id="summary"></section>
    <div class="actions">
      <button type="button" class="ghost" id="copyBtn">Chép tổng kết</button>
      <button type="button" class="danger" id="resetBtn">Xóa hết</button>
    </div>
  </div>

  <div class="dock">
    <button type="button" id="saveBtn" disabled>Lưu ván</button>
  </div>

  <dialog id="ask">
    <h2 id="askTitle">Xóa?</h2>
    <p id="askText"></p>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="askNo">Không</button>
      <button type="button" id="askYes">Xóa</button>
    </div>
  </dialog>
  <p class="toast" id="toast" hidden></p>

  <script>
    const KEY = "baibac-bon-nguoi";
    const SEATS = ["#0e7a48", "#c46a1a", "#1d4e89", "#7c3a63"];

    function blank() {
      return {
        players: [1, 2, 3, 4].map((n) => ({ id: "p" + n, name: "Người " + n })),
        draft: {},
        rounds: [],
      };
    }

    function load() {
      const next = blank();
      try {
        const data = JSON.parse(localStorage.getItem(KEY) || "null");
        if (!data) return next;
        for (const player of next.players) {
          const saved = (data.players || []).find((item) => item.id === player.id);
          if (saved && String(saved.name || "").trim()) player.name = String(saved.name).trim().slice(0, 24);
          const item = data.draft && data.draft[player.id];
          if (item && typeof item === "object") {
            next.draft[player.id] = {
              amt: String(item.amt || "").replace(/[^\d]/g, "").slice(0, 12),
              sign: item.sign === "win" || item.sign === "lose" ? item.sign : "",
            };
          }
        }
        if (Array.isArray(data.rounds)) {
          next.rounds = data.rounds.filter((round) => round && round.deltas && typeof round.deltas === "object").slice(-200);
        }
      } catch (error) {}
      return next;
    }

    let state = load();
    let pending = null;
    let toastTimer = 0;

    function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function uid() { return Math.random().toString(36).slice(2, 10); }
    function parseAmount(raw) {
      const digits = String(raw ?? "").replace(/[^\d]/g, "");
      if (!digits) return 0;
      return Math.min(Number(digits), 100000000000);
    }
    function formatPlain(amount) {
      return new Intl.NumberFormat("vi-VN").format(Math.abs(Math.round(amount))) + " đ";
    }
    function formatSigned(amount) {
      const n = Math.round(amount);
      if (!n) return "0 đ";
      return (n > 0 ? "+" : "−") + formatPlain(n);
    }
    function tone(amount) {
      if (amount > 0) return "pos";
      if (amount < 0) return "neg";
      return "zero";
    }
    function esc(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function nameOf(id) {
      const player = state.players.find((item) => item.id === id);
      return player ? player.name : "Người";
    }
    function cell(id) {
      return state.draft[id] || { amt: "", sign: "" };
    }
    function signed(id) {
      const item = cell(id);
      const money = parseAmount(item.amt);
      if (!money || (item.sign !== "win" && item.sign !== "lose")) return 0;
      return item.sign === "win" ? money : -money;
    }
    function balances() {
      const totals = {};
      for (const player of state.players) totals[player.id] = 0;
      for (const round of state.rounds) {
        for (const player of state.players) totals[player.id] += round.deltas[player.id] || 0;
      }
      return totals;
    }
    function plan() {
      const deltas = {};
      const parts = [];
      let total = 0;
      let used = 0;
      let missingSign = false;
      for (const player of state.players) {
        const item = cell(player.id);
        const money = parseAmount(item.amt);
        if (!money) continue;
        if (item.sign !== "win" && item.sign !== "lose") { missingSign = true; continue; }
        const amount = item.sign === "win" ? money : -money;
        deltas[player.id] = amount;
        total += amount;
        used += 1;
        parts.push(player.name + " " + formatSigned(amount));
      }
      if (!used && !missingSign) return { ok: false, reason: "empty", total: 0, parts, deltas };
      if (missingSign) return { ok: false, reason: "sign", total, parts, deltas };
      if (total !== 0) return { ok: false, reason: "sum", total, parts, deltas };
      const winner = state.players.slice().sort((a, b) => (deltas[b.id] || 0) - (deltas[a.id] || 0))[0];
      return { ok: true, deltas, parts, winner };
    }
    function settle(totals) {
      const debtors = [];
      const creditors = [];
      for (const player of state.players) {
        const amount = totals[player.id] || 0;
        if (amount < 0) debtors.push({ name: player.name, left: -amount });
        else if (amount > 0) creditors.push({ name: player.name, left: amount });
      }
      debtors.sort((a, b) => b.left - a.left);
      creditors.sort((a, b) => b.left - a.left);
      const rows = [];
      let i = 0;
      let j = 0;
      while (i < debtors.length && j < creditors.length) {
        const amount = Math.min(debtors[i].left, creditors[j].left);
        if (!amount) break;
        rows.push(debtors[i].name + " trả " + creditors[j].name + " " + formatPlain(amount));
        debtors[i].left -= amount;
        creditors[j].left -= amount;
        if (!debtors[i].left) i += 1;
        if (!creditors[j].left) j += 1;
      }
      return rows;
    }
    function summaryText() {
      const totals = balances();
      const lines = ["Tổng kết", ""];
      for (const player of state.players) lines.push(player.name + ": " + formatSigned(totals[player.id]));
      const rows = settle(totals);
      lines.push("", rows.length ? "Ai trả ai:" : "Sổ đang hòa.");
      for (const row of rows) lines.push(row);
      return lines.join("\n");
    }
    function toast(message) {
      const node = document.getElementById("toast");
      node.hidden = false;
      node.textContent = message;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { node.hidden = true; }, 2200);
    }

    function renderBoard() {
      const totals = balances();
      document.getElementById("board").innerHTML = state.players.map((player, index) => {
        const item = cell(player.id);
        return `
          <div class="row ${item.sign || ""}">
            <div class="row-top">
              <span class="seat" style="background:${SEATS[index]}">${index + 1}</span>
              <input class="name" aria-label="Tên ${esc(player.name)}" data-name="${player.id}" value="${esc(player.name)}" maxlength="24" />
              <span class="bal ${tone(totals[player.id])}">${formatSigned(totals[player.id])}</span>
            </div>
            <div class="row-entry">
              <div class="money">
                <input id="amt-${player.id}" aria-label="Tiền ${esc(player.name)}" data-amt="${player.id}" inputmode="numeric" autocomplete="off" placeholder="0" value="${esc(item.amt)}" />
                <span>đ</span>
              </div>
              <div class="signs">
                <button type="button" class="sign" data-sign="win" data-id="${player.id}" aria-pressed="${item.sign === "win" ? "true" : "false"}">Cộng</button>
                <button type="button" class="sign" data-sign="lose" data-id="${player.id}" aria-pressed="${item.sign === "lose" ? "true" : "false"}">Trừ</button>
              </div>
            </div>
          </div>`;
      }).join("");
    }

    function renderPreview() {
      const button = document.getElementById("saveBtn");
      const box = document.getElementById("preview");
      const current = plan();
      if (current.reason === "empty") {
        button.disabled = true;
        button.textContent = "Lưu ván";
        box.textContent = "Nhập số, rồi bấm Cộng hoặc Trừ.";
        return;
      }
      if (current.reason === "sign") {
        button.disabled = true;
        button.textContent = "Lưu ván";
        box.textContent = "Bấm Cộng hoặc Trừ cho ô vừa nhập.";
        return;
      }
      if (current.reason === "sum") {
        button.disabled = true;
        button.textContent = "Lưu ván";
        box.textContent = "Tổng đang lệch " + formatSigned(current.total) + ". Sửa cho về 0.";
        return;
      }
      button.disabled = false;
      button.textContent = "Lưu ván";
      box.textContent = current.parts.join(" · ");
    }

    function renderRounds() {
      const host = document.getElementById("rounds");
      if (!state.rounds.length) {
        host.innerHTML = '<p class="empty">Chưa có ván nào.</p>';
        return;
      }
      host.innerHTML = state.rounds.slice().reverse().map((round) => {
        const time = new Date(round.at).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" });
        const bits = state.players.filter((player) => round.deltas[player.id]).map((player) => player.name + " " + formatSigned(round.deltas[player.id]));
        return `
          <article class="round">
            <div class="round-top">
              <strong>${esc(bits[0] || "Ván")}</strong>
              <span class="when">${esc(time)}</span>
            </div>
            <p>${esc(bits.join(" · "))}</p>
            <button type="button" class="chip" data-drop="${round.id}">Xóa ván</button>
          </article>`;
      }).join("");
    }

    function renderSummary() {
      const totals = balances();
      const rows = settle(totals);
      const lines = state.players.map((player) => `<div class="sum-line"><span>${esc(player.name)}</span><strong class="${tone(totals[player.id])}">${formatSigned(totals[player.id])}</strong></div>`).join("");
      const transfers = rows.length
        ? rows.map((row) => `<div class="transfer"><span>${esc(row)}</span></div>`).join("")
        : '<p class="empty">Sổ đang hòa.</p>';
      document.getElementById("summary").innerHTML = lines + transfers;
    }

    function refresh() {
      renderBoard();
      renderPreview();
      renderRounds();
      renderSummary();
    }

    function commit() {
      const current = plan();
      if (!current.ok) return;
      state.rounds.push({
        id: uid(),
        at: Date.now(),
        winnerId: current.winner ? current.winner.id : null,
        deltas: current.deltas,
      });
      state.draft = {};
      save();
      refresh();
      toast("Đã lưu ván");
    }

    document.getElementById("board").addEventListener("input", (event) => {
      const nameId = event.target.dataset.name;
      if (nameId) {
        const player = state.players.find((item) => item.id === nameId);
        if (!player) return;
        player.name = event.target.value.slice(0, 24);
        save();
        renderPreview();
        renderRounds();
        renderSummary();
        return;
      }
      const id = event.target.dataset.amt;
      if (!id) return;
      const clean = event.target.value.replace(/[^\d]/g, "").slice(0, 12);
      if (clean !== event.target.value) event.target.value = clean;
      const item = cell(id);
      item.amt = clean;
      state.draft[id] = item;
      save();
      renderPreview();
    });
    document.getElementById("board").addEventListener("focusout", (event) => {
      const id = event.target.dataset && event.target.dataset.name;
      if (!id) return;
      const player = state.players.find((item) => item.id === id);
      if (!player) return;
      player.name = player.name.trim() || ("Người " + id.slice(1));
      event.target.value = player.name;
      save();
      renderPreview();
      renderRounds();
      renderSummary();
    });
    document.getElementById("board").addEventListener("click", (event) => {
      const button = event.target.closest("[data-sign]");
      if (!button) return;
      const id = button.dataset.id;
      const item = cell(id);
      item.sign = item.sign === button.dataset.sign ? "" : button.dataset.sign;
      state.draft[id] = item;
      save();
      document.querySelectorAll('[data-id="' + id + '"][data-sign]').forEach((node) => {
        node.setAttribute("aria-pressed", node.dataset.sign === item.sign ? "true" : "false");
      });
      const row = button.closest(".row");
      if (row) row.className = "row" + (item.sign ? " " + item.sign : "");
      renderPreview();
    });
    document.getElementById("board").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && event.target.dataset.amt) {
        event.preventDefault();
        commit();
      }
    });
    document.getElementById("rounds").addEventListener("click", (event) => {
      const button = event.target.closest("[data-drop]");
      if (!button) return;
      pending = { type: "round", id: button.dataset.drop };
      document.getElementById("askTitle").textContent = "Xóa ván này?";
      document.getElementById("askText").textContent = "Tiền của ván sẽ trừ khỏi tổng kết.";
      document.getElementById("ask").showModal();
    });
    document.getElementById("saveBtn").addEventListener("click", commit);
    document.getElementById("copyBtn").addEventListener("click", async () => {
      const text = summaryText();
      try {
        await navigator.clipboard.writeText(text);
        toast("Đã chép tổng kết");
      } catch (error) {
        toast(text);
      }
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      pending = { type: "all" };
      document.getElementById("askTitle").textContent = "Xóa hết các ván?";
      document.getElementById("askText").textContent = "Tên bốn người vẫn được giữ.";
      document.getElementById("ask").showModal();
    });
    document.getElementById("askNo").addEventListener("click", () => {
      pending = null;
      document.getElementById("ask").close();
    });
    document.getElementById("askYes").addEventListener("click", () => {
      if (pending && pending.type === "round") state.rounds = state.rounds.filter((round) => round.id !== pending.id);
      if (pending && pending.type === "all") state.rounds = [];
      pending = null;
      document.getElementById("ask").close();
      save();
      refresh();
      toast("Đã xóa");
    });

    refresh();
  </script>
</body>
</html>
